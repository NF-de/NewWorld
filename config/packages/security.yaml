security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_DIRECTOR
        ROLE_DIRECTOR: ROLE_SECRETAIRE

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 1. Le firewall de connexion pour Flutter
        login:
            pattern: ^/api/login_check
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # 2. Le firewall qui protège le reste de l'API
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        # 3. Le firewall pour ton site web classique
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_main
            logout:
                path: app_logout
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Tes règles d'accès sont parfaites et bien ordonnées !
    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/produits, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/entreprises, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/prixes, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: ROLE_CLIENT }
        - { path: ^/admin, roles: ROLE_SECRETAIRE }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10